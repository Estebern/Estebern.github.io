<title>Potential Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="css/styles.css">

<!-- Page structure. All behaviour lives in /js, all looks in /css/styles.css. -->
<div id="stage">
  <!-- The 3D scene is drawn into this canvas -->
  <canvas id="gl" role="img" aria-label="3D desk with an emblem. Select the emblem to open five portfolio sections."></canvas>

  <!-- Yellow section tags, positioned by js/ui.js from 3D blade positions -->
  <div id="tags" class="tags"></div>

  <!-- "View details" prompt shown on the first screen -->
  <button id="hint" class="hint" type="button">
    <span class="hint-dot"></span>
    <span><b>View details</b><small>Select the emblem</small></span>
  </button>

  <!-- Heads-up display: tabs and back button on top, counter and prev/next at the bottom -->
  <div id="hud">
    <div class="top">
      <div class="spacer"></div>
      <nav class="tabs" id="tabs" aria-label="Sections"></nav>
      <button class="back" id="back" type="button" aria-label="Back">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"><path d="M12.5 4 6.5 10l6 6"/></svg>
      </button>
    </div>
    <div class="bottom">
      <div class="foot">Portfolio prototype<br>Sample content</div>
      <div class="nav" id="snav"><button id="prev" type="button"></button><button id="next" type="button"></button></div>
      <div class="count"><small id="cl">Sections</small><div><b id="cn">05</b><span id="ct"></span></div></div>
    </div>
  </div>

  <div id="loading">Loading desk</div>
</div>

<!-- Three.js from the CDN, then our scripts. Order matters: each file uses the ones above it. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/content.js"></script>   <!-- 1. your name and section text (edit this one) -->
<script src="js/utils.js"></script>     <!-- 2. small helpers: easing, lerp, seeded random -->
<script src="js/textures.js"></script>  <!-- 3. canvas-drawn textures: desk, section cards, paper, pass -->
<script src="js/world.js"></script>     <!-- 4. 3D objects: lights, desk, props, stations, emblem -->
<script src="js/camera.js"></script>    <!-- 5. camera poses, fly-to tween, mouse parallax -->
<script src="js/nav.js"></script>       <!-- 6. state machine: overview, detail, station -->
<script src="js/ui.js"></script>        <!-- 7. HTML interface: tabs, tags, buttons, keyboard -->
<script src="js/main.js"></script>      <!-- 8. boot: renderer, picking, render loop -->
